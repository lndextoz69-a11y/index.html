<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนับยอดส่งยอด</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- ================= หมวดที่ 1: ไก่สด ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่สด</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/84bL3p1s/images.jpg" alt="ไก่สด 1"></div>
                    <div class="split-input-group">
                        <input type="number" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">จำนวนถุง / เคส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/JFc9nzwh/3.jpg" alt="ไก่สด 2"></div>
                    <div class="split-input-group">
                        <input type="number" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">จำนวนถุง / เคส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/5hbYdWmQ/images-1.jpg" alt="ไก่สด 3"></div>
                    <div class="split-input-group">
                        <input type="number" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">จำนวนถุง / เคส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/Fk27DqVB/images-5.jpg" alt="ไก่สด 4"></div>
                    <div class="split-input-group">
                        <input type="number" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">จำนวนถุง / เคส</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 2: ไก่ที่ทอด ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่ที่ทอด</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/PvnRbDJQ/images-4.jpg" alt="ไก่ทอด"></div>
                    <input type="number" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">ไก่ที่ทอด</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/DD3gVyD8/2.jpg" alt="ไก่ทอด"></div>
                    <input type="number" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">ไก่ที่ทอด</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/Y4w0rKCy/images-3.jpg" alt="ไก่ทอด"></div>
                    <input type="number" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">ไก่ที่ทอด</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/PZfJ9QYs/images-2.jpg" alt="ไก่ทอด"></div>
                    <input type="number" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">ไก่ที่ทอด</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 3: ไก่เหลือ ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่เหลือ</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="ใส่ลิงก์รูปไก่เหลือ1.jpg" alt="ไก่เหลือ"></div>
                    <input type="number" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">ไก่เหลือ</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="ใส่ลิงก์รูปไก่เหลือ2.jpg" alt="ไก่เหลือ"></div>
                    <input type="number" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">ไก่เหลือ</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="ใส่ลิงก์รูปไก่เหลือ3.jpg" alt="ไก่เหลือ"></div>
                    <input type="number" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">ไก่เหลือ</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="ใส่ลิงก์รูปไก่เหลือ4.jpg" alt="ไก่เหลือ"></div>
                    <input type="number" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">ไก่เหลือ</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 4: ไก่ที่กิน ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่ที่กิน</h2>
            <div class="vertical-list">
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PvnRbDJQ/images-4.jpg" alt="รูป"></div>
                    <div class="input-group-inline"><input type="number" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/DD3gVyD8/2.jpg" alt="รูป"></div>
                    <div class="input-group-inline"><input type="number" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/Y4w0rKCy/images-3.jpg" alt="รูป"></div>
                    <div class="input-group-inline"><input type="number" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PZfJ9QYs/images-2.jpg" alt="รูป"></div>
                    <div class="input-group-inline"><input type="number" placeholder="กี่ชิ้น"></div>
                </div>
            </div>
        </div>

                <!-- ================= หมวดที่ 5: แก๊ส ข้าว การเงิน ================= -->
        <div class="section-box">
            <div class="vertical-list">
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PsqJMds2/images-7.jpg" alt="แก๊ส"></div>
                    <div class="label-inline">แก๊ส</div>
                    <div class="input-group-inline"><input type="number" id="gas" value="0" oninput="calculateTotal()" placeholder="กี่ถัง"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="ลิงก์รูปข้าว.jpg" alt="ข้าว"></div>
                    <div class="label-inline">ข้าว</div>
                    <div class="input-group-inline"><input type="number" id="rice" value="0" oninput="calculateTotal()" placeholder="กี่รอบ"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="ลิงก์รูปกรุงไทย.jpg" alt="กรุงไทย"></div>
                    <div class="label-inline">กรุงไทย</div>
                    <div class="input-group-inline"><input type="number" id="krungthai" value="0" oninput="calculateTotal()" placeholder="กี่บาท"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="ลิงก์รูปเงินสด.jpg" alt="เงินสด"></div>
                    <div class="label-inline">เงินสด</div>
                    <div class="input-group-inline"><input type="number" id="cash" value="0" oninput="calculateTotal()" placeholder="กี่บาท"></div>
                </div>
            </div>
        </div>
        

        <!-- ================= สรุปยอดรวม ================= -->
        <div class="summary-formula-box">
    <div class="formula-item">กรุงไทย+เงินสด+แก๊ส+ข้าว</div>
    <div class="formula-op">=</div>
    <div class="formula-result" id="totalResult">0 บาท</div>
</div>

        <!-- ปุ่มคัดลอก -->
        <button class="copy-btn" onclick="copyData()">คัดลอกข้อมูลทั้งหมด</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
