<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนับยอดส่งยอด</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
                        <!-- ================= หมวดที่ 1: ไก่สด ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่สด</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/84bL3p1s/images.jpg" alt="ไก่สด 1"></div>
                    <div class="split-input-group">
                        <input type="number" id="fresh_ns1" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" id="fresh_ns2" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">น.ส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/JFc9nzwh/3.jpg" alt="ไก่สด 2"></div>
                    <div class="split-input-group">
                        <input type="number" id="fresh_nong1" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" id="fresh_nong2" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">น่อง</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/5hbYdWmQ/images-1.jpg" alt="ไก่สด 3"></div>
                    <div class="split-input-group">
                        <input type="number" id="fresh_peek1" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" id="fresh_peek2" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">ปีก</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/Fk27DqVB/images-5.jpg" alt="ไก่สด 4"></div>
                    <div class="split-input-group">
                        <input type="number" id="fresh_bone1" maxlength="2" placeholder="00">
                        <span class="slash">/</span>
                        <input type="number" id="fresh_bone2" maxlength="2" placeholder="00">
                    </div>
                    <span class="sub-label">โครง</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 2: ไก่ที่ทอด ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่ที่ทอด</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/PvnRbDJQ/images-4.jpg" alt="ไก่ทอด"></div>
                    <input type="number" id="fried_ns" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">น.ส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/DD3gVyD8/2.jpg" alt="ไก่ทอด"></div>
                    <input type="number" id="fried_nong" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">น่อง</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/Y4w0rKCy/images-3.jpg" alt="ไก่ทอด"></div>
                    <input type="number" id="fried_peek" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">ปีก</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="https://i.ibb.co/PZfJ9QYs/images-2.jpg" alt="ไก่ทอด"></div>
                    <input type="number" id="fried_bone" maxlength="3" class="single-input" placeholder="000">
                    <span class="sub-label">โครง</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 3: ไก่เหลือ ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่เหลือ</h2>
            <div class="grid-4">
                <div class="item-card">
                    <div class="img-box"><img src="" alt="ไก่เหลือ"></div>
                    <input type="number" id="left_ns" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">น.ส</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="" alt="ไก่เหลือ"></div>
                    <input type="number" id="left_nong" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">น่อง</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="" alt="ไก่เหลือ"></div>
                    <input type="number" id="left_peek" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">ปีก</span>
                </div>
                <div class="item-card">
                    <div class="img-box"><img src="" alt="ไก่เหลือ"></div>
                    <input type="number" id="left_bone" maxlength="2" class="single-input" placeholder="00">
                    <span class="sub-label">โครง</span>
                </div>
            </div>
        </div>

        <!-- ================= หมวดที่ 4: ไก่ที่กิน ================= -->
        <div class="section-box">
            <h2 class="main-title">ไก่กิน</h2>
            <div class="vertical-list">
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PvnRbDJQ/images-4.jpg" alt="รูป"></div>
                    <div class="label-inline">น.ส</div>
                    <div class="input-group-inline"><input type="number" id="eat_ns" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/DD3gVyD8/2.jpg" alt="รูป"></div>
                    <div class="label-inline">น่อง</div>
                    <div class="input-group-inline"><input type="number" id="eat_nong" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/Y4w0rKCy/images-3.jpg" alt="รูป"></div>
                    <div class="label-inline">ปีก</div>
                    <div class="input-group-inline"><input type="number" id="eat_peek" placeholder="กี่ชิ้น"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PZfJ9QYs/images-2.jpg" alt="รูป"></div>
                    <div class="label-inline">โครง</div>
                    <div class="input-group-inline"><input type="number" id="eat_bone" placeholder="กี่ชิ้น"></div>
                </div>
            </div>
        </div>
        
        

                <!-- ================= หมวดที่ 5: แก๊ส ข้าว การเงิน ================= -->
        <div class="section-box">
            <div class="vertical-list">
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/PsqJMds2/images-7.jpg" alt="แก๊ส"></div>
                    <div class="label-inline">แก๊ส</div>
                    <div class="input-group-inline"><input type="number" id="gas" value="0" oninput="calculateTotal()" placeholder="กี่ถัง"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/cKj1FzC7/images-6.jpg" alt="ข้าว"></div>
                    <div class="label-inline">ข้าว</div>
                    <div class="input-group-inline"><input type="number" id="rice" value="0" oninput="calculateTotal()" placeholder="กี่รอบ"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/cGLg9t0/images-9.jpg" alt="กรุงไทย"></div>
                    <div class="label-inline">กรุงไทย</div>
                    <div class="input-group-inline"><input type="number" id="krungthai" value="0" oninput="calculateTotal()" placeholder="กี่บาท"></div>
                </div>
                <div class="row-item">
                    <div class="img-box-sm"><img src="https://i.ibb.co/M5nrBnKK/images-8.jpg" alt="เงินสด"></div>
                    <div class="label-inline">เงินสด</div>
                    <div class="input-group-inline"><input type="number" id="cash" value="0" oninput="calculateTotal()" placeholder="กี่บาท"></div>
                </div>
            </div>
        </div>
        

        <!-- ================= สรุปยอดรวม ================= -->
        <div class="summary-formula-box">
    <div class="formula-item">กรุงไทย+เงินสด+แก๊ส</div>
    <div class="formula-op">=</div>
    <div class="formula-result" id="totalResult">0 บาท</div>
</div>

        <!-- ปุ่มคัดลอก -->
        <button class="copy-btn" onclick="copyData()">คัดลอกข้อมูลทั้งหมด</button>

    </div>

    <script src="script.js"></script>




<!-- ปุ่มเปิดหน้าต่างแชทเล็กๆ -->
<button onclick="openAiModal()" style="position: fixed; bottom: 20px; right: 20px; background: #3b6fe0; color: white; border: none; border-radius: 50px; padding: 12px 20px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 999;">
    💬 เปิดแชท AI ฟังเสียง
</button>

<!-- หน้าต่างป๊อปอัป (Modal) -->
<div id="aiModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #1a1e28; width: 90%; max-width: 400px; height: 500px; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2c3242; color: white;">
        
        <!-- หัวกล่องป๊อปอัป -->
        <div style="padding: 12px 16px; background: #12151c; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c3242;">
            <h3 style="margin: 0; font-size: 16px;">AI ผู้ช่วยอ่านข้อความ</h3>
            <button onclick="closeAiModal()" style="background: none; border: none; color: #8b93a4; font-size: 20px; cursor: pointer;">✕</button>
        </div>

        <!-- พื้นที่แสดงข้อความแชท -->
        <div id="aiChatBox" style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
            <div style="background: #2a2f3a; padding: 10px 12px; border-radius: 12px; max-width: 80%; font-size: 14px;">
                สวัสดีครับ! วางข้อความยอดไก่ของคุณลงข้างล่างนี้ได้เลย เดี๋ยวผมจะส่งกลับมาให้และมีปุ่มกดฟังเสียงครับ 🍗
            </div>
        </div>

        <!-- แถบพิมพ์/วางข้อความด้านล่าง -->
        <div style="padding: 10px; background: #12151c; border-top: 1px solid #2c3242; display: flex; gap: 8px;">
            <textarea id="aiInput" placeholder="แตะค้างเพื่อวางข้อความที่คัดลอกมา..." style="flex: 1; background: #1a1e28; color: white; border: 1px solid #2c3242; border-radius: 8px; padding: 8px; resize: none; height: 40px; font-family: inherit; outline: none;"></textarea>
            <button onclick="sendTextToAi()" style="background: #3b6fe0; color: white; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-weight: bold;">ส่ง</button>
        </div>

    </div>
</div>
    







    
</body>
</html>
